# autostart — apps started at login. Add one quoted line per app.
[general]
autostart = [
  "noctalia",
  "walker --gapplication-service",
  "wlsunset -l 52.5 -L 13.4",
  "flatpak run org.openrgb.OpenRGB --startminimized",
]
# The polkit agent (polkit-kde-authentication-agent-1) autostarts via
# /etc/xdg/autostart on openSUSE — nothing to add here.
show_cheatsheet = true
