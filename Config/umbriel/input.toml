# input — keyboard, mouse, touchpad.
[input.keyboard]
# US-Intl mit AltGr-Dead-Keys. Anführungszeichen tippt direkt ",
# Umlaute via AltGr+Shift+" dann Buchstabe (ä/ö/ü/Ä/Ö/Ü/ß).
# Menü-Taste zusätzlich als Compose-Key.
layout = "us"
variant = "altgr-intl"
options = "terminate:ctrl_alt_bksp,compose:menu"
model = "pc105"
repeat_rate = 40
repeat_delay = 250
numlock_toggle = true

[input.focus]
follows_mouse = true

# Natural scroll on (inverted, like Niri)
[input.touchpad]
tap = true
natural_scroll = true
click_method = "clickfinger"
scroll_factor = 0.4
disable_while_typing = true

[input.tablet]
enabled = true
map_to_output = "DP-1"

[input.cursor]
theme = "Adwaita"
size = 24
hardware_cursor = true
hide_when_typing = true
