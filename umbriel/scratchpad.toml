# scratchpad — benannte Scratchpads (Quake-Mode).
# Benötigt `default`-Ersatz: sobald ein Name definiert ist, entfällt das
# implizite default-Pad — alle Actions brauchen Namenssuffix.
# Validate: umbriel config validate

# --- Quake-Terminal: reines Ghostty (Tabs, Rechtsklick), schwebend mittig ---
# `--class=` braucht GTK-ID-Format (Klasse mit Punkt), sonst `invalid class`.
[[scratchpad]]
name = "quake"
spawn_when_empty = "ghostty -a dev.quake.Terminal"

[[window_rule]]
match.app_id = "^dev[.]quake[.]Terminal$"
default_scratchpad = "quake"
# Fixe Pixel-Geometrie (statt Fraktionen): Umbriel behaelt die Oeffnungs-
# Groesse beim Output-Wechsel (nur Nachzentrierung, kein Resize). 880x840
# passt auf beide Outputs (DP-1: 2560x1414, HDMI: 1920x1054 usable).
default_floating_size_px = { width = 880, height = 840 }
default_position = { x = 0, y = 0, anchor = "center" }
# Echter Hintergrund-Blur (nicht optimized): nimmt das darunterliegende
# Workspace-Bild mit, statt X-Ray. Deckkraft leicht runter fuer cleanen Look.
opacity = 0.8
blur = true
blur_optimized = false
